<mat-card class="auth-card">
  <mat-card-title>Reset your password</mat-card-title>
  @if (sent) {
    <p>{{ sentMessage }}</p>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()">
      <p>Enter the email address you sign in with and we'll send you a link to choose a new password.</p>
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email">
      </mat-form-field>
      @if (errorMessage) {
        <p class="auth-error">{{ errorMessage }}</p>
      }
      <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || submitting">
        Send reset link
      </button>
    </form>
  }
  <p class="auth-switch"><a routerLink="/login">Back to log in</a></p>
</mat-card>
