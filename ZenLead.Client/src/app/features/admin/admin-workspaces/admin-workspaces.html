<div class="list-header">
  <h1>Workspaces</h1>
  <button mat-raised-button color="primary" type="button" (click)="openCreate()">Create workspace</button>
</div>

<mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>
<p *ngIf="errorMessage" class="error" role="alert">{{ errorMessage }}</p>

<p *ngIf="!loading && !errorMessage && workspaces.length === 0" class="empty-state">
  No workspaces yet — create the first one.
</p>

<table mat-table [dataSource]="workspaces" *ngIf="workspaces.length > 0" class="workspaces-table">
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let w">{{ w.name }}</td>
  </ng-container>
  <ng-container matColumnDef="adminEmail">
    <th mat-header-cell *matHeaderCellDef>Admin email</th>
    <td mat-cell *matCellDef="let w">{{ w.adminEmail ?? '—' }}</td>
  </ng-container>
  <ng-container matColumnDef="timeZone">
    <th mat-header-cell *matHeaderCellDef>Time zone</th>
    <td mat-cell *matCellDef="let w">{{ w.timeZone }}</td>
  </ng-container>
  <ng-container matColumnDef="userCount">
    <th mat-header-cell *matHeaderCellDef>Users</th>
    <td mat-cell *matCellDef="let w">{{ w.userCount }}</td>
  </ng-container>
  <ng-container matColumnDef="createdAt">
    <th mat-header-cell *matHeaderCellDef>Created</th>
    <td mat-cell *matCellDef="let w">{{ w.createdAt | date: 'mediumDate' }}</td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns"></tr>
</table>
