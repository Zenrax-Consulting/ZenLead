<h2 mat-dialog-title>Create workspace</h2>
<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="dialog-form">
    <mat-form-field appearance="outline">
      <mat-label>Workspace name</mat-label>
      <input matInput formControlName="name" maxlength="200">
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Admin email</mat-label>
      <input matInput type="email" formControlName="adminEmail" maxlength="256">
      <mat-hint>This person approves who joins the workspace.</mat-hint>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Time zone</mat-label>
      <mat-select formControlName="timeZone">
        @for (tz of timeZones; track tz) {
          <mat-option [value]="tz">{{ tz }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <p *ngIf="errorMessage" class="dialog-error" role="alert">{{ errorMessage }}</p>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>Cancel</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || submitting">Create</button>
  </mat-dialog-actions>
</form>
