<mat-card class="account-card">
  <mat-card-title>Change password</mat-card-title>
  <form [formGroup]="form" #formDirective="ngForm" (ngSubmit)="submit(formDirective)">
    <mat-form-field appearance="outline">
      <mat-label>Current password</mat-label>
      <input matInput type="password" formControlName="currentPassword" autocomplete="current-password">
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>New password</mat-label>
      <input matInput type="password" formControlName="newPassword" autocomplete="new-password">
      <mat-hint>{{ hint }}</mat-hint>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Confirm new password</mat-label>
      <input matInput type="password" formControlName="confirm" autocomplete="new-password">
    </mat-form-field>
    @if (form.hasError('mismatch') && form.controls['confirm'].touched) {
      <p class="account-error">The passwords don't match.</p>
    }
    @if (errorMessage) {
      <p class="account-error">{{ errorMessage }}</p>
    }
    <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || submitting">
      Change password
    </button>
  </form>
  <p class="account-note">Changing your password signs you out on every other device.</p>
</mat-card>
