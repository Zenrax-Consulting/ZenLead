<mat-toolbar color="primary" class="shell-toolbar">
  @if (isMobile) {
    <button mat-icon-button type="button" (click)="nav.toggle()" aria-label="Toggle navigation"><mat-icon>menu</mat-icon></button>
  }
  <a class="app-name" [routerLink]="homeLink">ZenLead</a>
  <span class="spacer"></span>
  <span class="workspace-name">{{ workspaceName }}</span>
  <button mat-icon-button type="button" [matMenuTriggerFor]="account" aria-label="Account"><mat-icon>account_circle</mat-icon></button>
  <mat-menu #account="matMenu">
    @if (canOpenDashboard) {
      <button mat-menu-item type="button" (click)="openJobDashboard()">Job dashboard</button>
    }
    <a mat-menu-item routerLink="/account/password">Change password</a>
    <button mat-menu-item type="button" (click)="logout()">Log out</button>
  </mat-menu>
</mat-toolbar>

<mat-sidenav-container class="shell-container">
  <mat-sidenav #nav [mode]="isMobile ? 'over' : 'side'" [opened]="!isMobile">
    <mat-nav-list>
      @for (item of navItems; track item.link) {
        <a mat-list-item [routerLink]="item.link" routerLinkActive="active" (click)="isMobile && nav.close()" [attr.aria-label]="navLabel(item)">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle [matBadge]="badgeFor(item.link)" [matBadgeHidden]="badgeFor(item.link) === 0" matBadgeOverlap="false"
                matBadgeSize="small" aria-hidden="false">{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    @if (!isSuperAdmin) {
      <app-ai-budget-banner></app-ai-budget-banner>
    }
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
